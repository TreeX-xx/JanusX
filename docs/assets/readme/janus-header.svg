<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-labelledby="title">
  <title id="title">JanusX</title>
  <style>
    .shell { fill: #141414; stroke: #45484d; }
    .eyes { fill: #f5f5f5; }
    .word { fill: #1f2328; }
    .accent { fill: #ff7b32; }
    @media (prefers-color-scheme: dark) {
      .shell { stroke: #626973; }
      .word { fill: #f0f6fc; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .eyes { transform-origin: 66px 48px; animation: blink 8s ease-in-out infinite; }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.12); }
    }
  </style>
  <rect class="shell" x="18" y="24" width="96" height="48" rx="24" stroke-width="1.5"/>
  <g class="eyes">
    <rect x="48.5" y="39" width="14.5" height="18" rx="1"/>
    <rect x="69" y="39" width="14.5" height="18" rx="1"/>
  </g>
