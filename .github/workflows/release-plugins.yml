name: Sign official desktop plugins
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable desktop tag on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ref="refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$ref^{commit}" origin/main
          git checkout --detach "$ref"
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          git show origin/gh-pages:plugins/index.json > "$RUNNER_TEMP/previous-catalog.json"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and verify official packages
        env:
          JANUSX_PLUGIN_PREVIOUS_CATALOG: ${{ runner.temp }}/previous-catalog.json
          JANUSX_PLUGIN_KEY_ID: janusx-blueprint-20261026
          JANUSX_PLUGIN_SIGNING_KEY: ${{ secrets.JANUSX_PLUGIN_SIGNING_KEY }}
        run: |
          npm run plugins:package:mac -- "$RUNNER_TEMP/packages" --release-tag "$RELEASE_TAG" --arch arm64
          mkdir -p "$RUNNER_TEMP/distribution"
          cp "$RUNNER_TEMP"/packages/release-*/*.jxp "$RUNNER_TEMP/distribution/"
          node scripts/plugins/build-catalog.mjs "$RUNNER_TEMP/distribution/index.json" "$(date +%s)" "$RUNNER_TEMP"/packages/release-*/*.release.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-plugins-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/distribution
          if-no-files-found: error
          retention-days: 14
