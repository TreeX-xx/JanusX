# 手动 Windows 构建：验证后上传 Actions 附件，不创建或公开 Release。
# tag 仅标记版本；本地 stage:win 与 publish:win 分别上传草稿和公开。
# 前提：package.json 用 file: 引用 ../janus-agentX，先把它检出到同级目录
#（固定上游仓库，Fork 无需复制 sibling 仓库）。
# Note: reproducible inputs and release naming — see .agents/notes/desktop/reproducible-verification.md
name: release-win

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build (artifacts only; no publication)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-win-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout JanusX
        uses: actions/checkout@v4
        with:
          path: JanusX
          ref: refs/tags/${{ inputs.release_tag }}

      # Recovery retains the immutable application tag and updates only the
      # external runtime checker, after packaging has completed.
      - name: Checkout runtime verification tooling
        uses: actions/checkout@v4
        with:
          path: release-tooling
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/check-packaged-runtime.mjs
            scripts/publish-win.mjs
          sparse-checkout-cone-mode: false

      - name: Checkout sibling janus-agentX
        uses: actions/checkout@v4
        with:
          repository: TreeX-xx/janus-agentX
          ref: 4df4c4457269e46a52b7ed430db379e194fac175
          path: janus-agentX

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: JanusX/.node-version
          cache: npm
          cache-dependency-path: |
            JanusX/package-lock.json
            janus-agentX/package-lock.json

      # publisher 用 package.json 的 version 生成 tag 名与 latest.yml；
      # tag 与包版本错位会产出名字错乱的 Release 或静默无更新，先拦。
      - name: Version guard
        working-directory: JanusX
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$pkg") {
            Write-Error "tag $env:RELEASE_TAG != package.json v$pkg"
            exit 1
          }
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      # The binary is intentionally untracked; fresh runners must materialize
      # the same pinned artifact before electron-builder copies extraResources.
      - name: Prepare bundled OfficeCLI
        working-directory: JanusX
        shell: pwsh
        run: |
          $binary = 'resources/officecli/officecli.exe'
          Invoke-WebRequest -Uri 'https://github.com/iOfficeAI/OfficeCLI/releases/download/v1.0.135/officecli-win-x64.exe' -OutFile $binary
          node scripts/check-win-resources.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fail version/resource checks before dependency installation and builds.
      # Keep the sibling dependency layers aligned with verify.yml.
      - name: Build sibling janus-agentX
        working-directory: janus-agentX
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/agent-core --workspace=@janus-agent/harness-core --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/chat-core --workspace=@janus-agent/harness-node --workspace=@janus-agent/node-hosts --workspace=@janus-agent/notes-cli --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/janus-agent --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/cli --if-present

      - name: Install
        working-directory: JanusX
        run: npm run prepackage

      - name: Build
        working-directory: JanusX
        run: npm run build

      - name: Boundary check
        working-directory: JanusX
        run: npm run check:package-boundary

      # devDependencies 不进 archive。重新把 electron-builder.yml 的 dev-only
      # 排除块对齐当前生产闭包再打包：清单本身已提交，这里同步只是保证
      # 依赖变动后不会带着旧的排除集合发布。
      - name: Sync packaging exclusions
        working-directory: JanusX
        run: npm run exclusions:sync

      - name: Package Windows artifacts
        working-directory: JanusX
        run: npx electron-builder --win --x64 --publish never

      - name: Verify Windows artifacts
        working-directory: JanusX
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ../release-tooling/scripts/check-packaged-runtime.mjs -Destination scripts/check-packaged-runtime.mjs
          Copy-Item -LiteralPath ../release-tooling/scripts/publish-win.mjs -Destination scripts/publish-win.mjs
          npm run check:portable-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-win.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            JanusX/release/*/*-setup.exe
            JanusX/release/*/*-setup.exe.blockmap
            JanusX/release/*/*-portable.exe
            JanusX/release/*/latest.yml
            JanusX/release/*/beta.yml
            JanusX/release/*/win-unpacked/**
          if-no-files-found: error
          retention-days: 14
