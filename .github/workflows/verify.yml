# 可选远端验证：仅在维护者手动触发时运行完整 verify 链。
# PR 和分支 push 均不自动运行；日常验证在本地完成并记录结果。
# Note: reproducible inputs and clean-checkout tests — see .agents/notes/desktop/reproducible-verification.md
# Note: development promotion — see .agents/notes/desktop/development-branch.md
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout JanusX
        uses: actions/checkout@v4
        with:
          path: JanusX

      - name: Checkout sibling WorkFlowX
        uses: actions/checkout@v4
        with:
          repository: TreeX-xx/WorkFlowX
          ref: efaf5ae7aac24362286251dc931487d5cfd2e2a5
          path: WorkFlowX

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: JanusX/.node-version
          cache: npm
          cache-dependency-path: |
            JanusX/package-lock.json

      # Engine artifacts are pinned in vendor/janus-agent and checked before use.
      - name: Prepackage
        working-directory: JanusX
        run: npm ci && npm run prepackage

      # knowledge-note-ui 单测在 beforeAll 起 headless chromium；runner
      # 无预装浏览器则整个文件失败（v0.8.8 R3 新增用例首个需要的）。
      - name: Install Playwright chromium
        working-directory: JanusX
        run: npx playwright install chromium

      # 下述步骤与 package.json 的 verify 同序，拆步只为失败归因；
      # 改链时以 package.json 为准并同步此处。
      - name: Runtime boundaries
        working-directory: JanusX
        run: npm run check:runtime-boundaries

      - name: Theme check
        working-directory: JanusX
        run: npm run theme:check

      - name: Plugin SDK and platform
        working-directory: JanusX
        run: npm run plugins:check:platform

      - name: Official plugin distribution
        working-directory: JanusX
        run: npm run plugins:distribution:test:tools

      - name: Independent Blueprint package and Electron carrier
        working-directory: JanusX
        run: npm run plugins:blueprint:check

      - name: Upload Blueprint validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-validation
          path: JanusX/artifacts/plugins
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        working-directory: JanusX
        run: npm run typecheck

      - name: Typecheck llm-core
        working-directory: JanusX
        run: npm run typecheck:llm-core

      - name: Build llm-core
        working-directory: JanusX
        run: npm run build:llm-core

      # Limit runner memory use; verbose output identifies the last completed
      # test if a native watcher assertion terminates the worker.
      # Includes unit, integration and browser projects, and every plugin unit test once.
      - name: Unit, integration and browser tests
        working-directory: JanusX
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run test:unit:fast -- --maxWorkers=1 --no-file-parallelism --sequence.shuffle=false --reporter=verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:integration -- --maxWorkers=1 --no-file-parallelism --sequence.shuffle=false --reporter=verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser -- --maxWorkers=1 --no-file-parallelism --sequence.shuffle=false --reporter=verbose

      - name: Test llm-core
        working-directory: JanusX
        run: npm run test:llm-core

      - name: Strict unused check
        working-directory: JanusX
        run: npm run typecheck:strict-unused

      - name: Build
        working-directory: JanusX
        run: npm run build:app

      - name: Boundary check
        working-directory: JanusX
        run: npm run check:package-boundary

      - name: Packaging exclusions check
        working-directory: JanusX
        run: npm run exclusions:check

      - name: i18n check
        working-directory: JanusX
        run: npm run i18n:check

      - name: Note check
        working-directory: JanusX
        run: npm run check:notes

      - name: Lint
        working-directory: JanusX
        run: npm run lint

      - name: Desktop smoke
        working-directory: JanusX
        run: npm run test:e2e:desktop

      - name: Upload desktop failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-traces
          path: JanusX/test-results
          if-no-files-found: ignore
          retention-days: 7
