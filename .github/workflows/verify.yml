# PR 统一门禁：在 Windows runner 上跑仓库的 `verify` 全链。
# release-win 只做手动构建；本流程保留 PR 门禁和手动入口，不重复响应分支 push。
# Note: reproducible inputs and clean-checkout tests — see .agents/notes/desktop/reproducible-verification.md
# Note: development promotion — see .agents/notes/desktop/development-branch.md
name: verify

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JanusX
        uses: actions/checkout@v4
        with:
          path: JanusX

      - name: Checkout sibling janus-agentX
        uses: actions/checkout@v4
        with:
          repository: TreeX-xx/janus-agentX
          ref: 8baa18e5db8ca641871c139a5b76904bedc88dda
          path: janus-agentX

      # S1.2 相容测试与 Note 外链检查按相对路径 ../WorkFlowX 读取标准与
      # fixture；缺席则 ENOENT/unresolved-external-link 全红（v0.8.8 未推送
      # 时本地能过、远端必挂的根因）。pin 显式 SHA 以保证可复现。
      - name: Checkout sibling WorkFlowX
        uses: actions/checkout@v4
        with:
          repository: TreeX-xx/WorkFlowX
          ref: efaf5ae7aac24362286251dc931487d5cfd2e2a5
          path: WorkFlowX

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: JanusX/.node-version
          cache: npm
          cache-dependency-path: |
            JanusX/package-lock.json
            janus-agentX/package-lock.json

      # @janus-agent/* 以 dist/ 发布，CI 里是源码检出，必须先构建同级仓，
      # 否则 JanusX 侧 typecheck/bundle 找不到模块声明。
      # 同级仓 workspace 字母序先编 cli 再编其依赖，单次全量构建必败；
      # 此处按依赖分层显式定序，一次通过，不重试。
      # cli 必须单独在最后：它消费 notes-cli 的 dist，同批并行必撞 fresh-clone 空 dist。
      - name: Build sibling janus-agentX
        working-directory: janus-agentX
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/agent-core --workspace=@janus-agent/harness-core --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/chat-core --workspace=@janus-agent/harness-node --workspace=@janus-agent/node-hosts --workspace=@janus-agent/notes-cli --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/janus-agent --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace=@janus-agent/cli --if-present

      # file: 依赖需要先物化，否则 install 找不到同级包。
      - name: Prepackage
        working-directory: JanusX
        run: npm run prepackage

      # knowledge-note-ui 单测在 beforeAll 起 headless chromium；runner
      # 无预装浏览器则整个文件失败（v0.8.8 R3 新增用例首个需要的）。
      - name: Install Playwright chromium
        working-directory: JanusX
        run: npx playwright install chromium

      # 下述步骤与 package.json 的 verify 同序，拆步只为失败归因；
      # 改链时以 package.json 为准并同步此处。
      - name: Theme check
        working-directory: JanusX
        run: npm run theme:check

      - name: Plugin SDK and platform
        working-directory: JanusX
        run: npm run plugins:check

      - name: Official plugin distribution
        working-directory: JanusX
        run: npm run plugins:distribution:check

      - name: Independent Blueprint package and Electron carrier
        working-directory: JanusX
        run: npm run plugins:blueprint:check

      - name: Upload Blueprint validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-validation
          path: JanusX/artifacts/plugins
          if-no-files-found: ignore
          retention-days: 7

      - name: Typecheck
        working-directory: JanusX
        run: npm run typecheck

      - name: Typecheck llm-core
        working-directory: JanusX
        run: npm run typecheck:llm-core

      - name: Build llm-core
        working-directory: JanusX
        run: npm run build:llm-core

      # Limit runner memory use; verbose output identifies the last completed
      # test if a native watcher assertion terminates the worker.
      - name: Unit tests
        working-directory: JanusX
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:unit -- --run --maxWorkers=1 --no-file-parallelism --sequence.shuffle=false --reporter=verbose

      - name: Test llm-core
        working-directory: JanusX
        run: npm run test:llm-core

      - name: Strict unused check
        working-directory: JanusX
        run: npm run typecheck:strict-unused

      - name: Build
        working-directory: JanusX
        run: npm run build:app

      - name: Boundary check
        working-directory: JanusX
        run: npm run check:package-boundary

      - name: Packaging exclusions check
        working-directory: JanusX
        run: npm run exclusions:check

      - name: i18n check
        working-directory: JanusX
        run: npm run i18n:check

      - name: Note check
        working-directory: JanusX
        run: npm run check:notes

      - name: Lint
        working-directory: JanusX
        run: npm run lint

      - name: Desktop smoke
        working-directory: JanusX
        run: npm run test:e2e:desktop

      - name: Upload desktop failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-traces
          path: JanusX/test-results
          if-no-files-found: ignore
          retention-days: 7
