appId: com.janusx.app
productName: JanusX
npmRebuild: false
directories:
  output: release/${version}
  buildResources: resources

# node_modules is copied exactly as npm installed it instead of being re-derived
# by electron-builder's node-dep-tree pass. That pass nested a hoisted dependency
# under the wrong parent and left it absent from app.asar's node_modules root, so
# root-level consumers threw ERR_MODULE_NOT_FOUND and the packaged app died during
# bootstrap with no window, no dialog and no log. Patching the finished archive
# cannot repair this safely: electron-builder writes it with its own asar writer,
# whose smartUnpack flags no reimplementation reproduces faithfully.
# Note: entry — see .agents/notes/2026-09-20-packaged-hoisted-deps--39f58575.md
beforeBuild: ./scripts/electron-before-pack.cjs
includeSubNodeModules: true

files:
  # Everything npm installed, minus what cannot reach a packaged runtime.
  # monaco-editor is bundled into out/renderer (its language chunks ship as renderer
  # assets), so it needs no node_modules copy. packages/ stays in the archive
  # because node_modules/@janusx/llm-core is a symlink into it.
  - "**/*"
  - package.json
  - "!.cache{,/**/*}"
  - "!.claude{,/**/*}"
  - "!.codex{,/**/*}"
  # Local scratch from the same toolchain family as .codex and .janusX above:
  # gitignored, never part of a packaged runtime, and large enough to matter.
  # .codex-tmp/prepush-* held a stale sibling checkout whose node_modules added
  # 10k archive entries and 63 MiB to the 0.9.0 portable before this line.
  - "!.codex-cache{,/**/*}"
  - "!.codex-session{,/**/*}"
  - "!.codex-sessions{,/**/*}"
  - "!.codex-tmp{,/**/*}"
  - "!.hybrid{,/**/*}"
  - "!.github{,/**/*}"
  - "!.janusX{,/**/*}"
  - "!.agents{,/**/*}"
  - "!artifacts{,/**/*}"
  - "!apps{,/**/*}"
  - "!scripts/android-lab{,/**/*}"
  - "!scripts/remote-lab{,/**/*}"
  - "!design{,/**/*}"
  - "!release{,/**/*}"
  - "!src{,/**/*}"
  # Downloadable features have their own signed packages, including build caches
  # and vendor archives. Host compatibility code is still bundled under out/.
  - "!plugins{,/**/*}"
  - "!test-results{,/**/*}"
  - "!tests{,/**/*}"
  - "!resources/laya{,/**/*}"
  - "!wiki{,/**/*}"
  - "!playwright.config.ts"
  - "!playwright.blueprint.config.ts"
  - "!packaging-issues.md"
  - "!.tmp-*"
  - "!*.tmp.*"
  - "!*.log"
  - "!node_modules/.bin{,/**/*}"
  - "!node_modules/.cache{,/**/*}"
  - "!node_modules/.package-lock.json"
  - "!node_modules/.vite{,/**/*}"
  - "!node_modules/.vite-cache{,/**/*}"
  - "!node_modules/.vite-*{,/**/*}"
  - "!node_modules/monaco-editor{,/**/*}"

  # Everything the production dependency closure never reaches. node_modules is
  # copied verbatim, so without these negations every devDependency ships in
  # app.asar and again in app.asar.unpacked. electron's dist is the built-in
  # module at runtime and typescript is declared by the MCP and Lark SDKs but
  # required by neither; both are in the closure and are negated by hand.
  # Note: entry — see .agents/notes/2026-09-20-packaged-runtime-size--210d9ec3.md
  - "!node_modules/electron{,/**/*}"
  - "!node_modules/typescript{,/**/*}"
  # Source maps of shipped packages carry no runtime behaviour.
  - "!**/*.map"

