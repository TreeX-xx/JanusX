asarUnpack:
  - node_modules/node-pty/**/*

publish:
  provider: github
  owner: TreeX-xx
  repo: JanusX
  channel: latest
  publishAutoUpdate: true
  # 默认为 draft（见 electron-publish 文档），草稿不进 Atom feed，
  # 客户端拉不到 latest.yml。Win P0 要正式 Release。
  releaseType: release

win:
  extraResources:
    - from: resources/officecli/officecli.exe
      to: officecli/officecli.exe
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  # Chromium starts sandboxed subprocesses from this same executable. Requiring
  # elevation here can prevent GPU process creation on Windows 10 (error 18).
  # Terminals inherit the ordinary desktop process token.
  # Note: .agents/notes/desktop/reproducible-verification.md
  requestedExecutionLevel: asInvoker

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user

mac:
  # Distribution policy includes OfficeCLI's .NET 10 support range, not only Electron.
  # Note: .agents/notes/desktop/macos-compatibility.md (MAC-11; native acceptance pending)
  minimumSystemVersion: '15.0'
  extraResources:
    - from: resources/officecli/darwin-${arch}/officecli
      to: officecli/darwin-${arch}/officecli
  # Preserve the upstream signature: re-signing changes the broker's pinned hash.
  signIgnore:
    - '/Contents/Resources/officecli/darwin-(arm64|x64)/officecli$'
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
