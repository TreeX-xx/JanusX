extraResources:
  - from: resources/laya
    to: laya
    filter:
      - "sidecar.py"
      - "model-manifest.json"
      - "requirements.txt"
  - from: resources/officecli
    to: officecli

asarUnpack:
  - node_modules/node-pty/**/*

publish:
  provider: github
  owner: TreeX-xx
  repo: JanusX
  channel: latest
  publishAutoUpdate: true
  # 默认为 draft（见 electron-publish 文档），草稿不进 Atom feed，
  # 客户端拉不到 latest.yml。Win P0 要正式 Release。
  releaseType: release

win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  # Chromium starts sandboxed subprocesses from this same executable. Requiring
  # elevation here can prevent GPU process creation on Windows 10 (error 18).
  # Terminals inherit the ordinary desktop process token.
  # Note: .agents/notes/desktop/reproducible-verification.md
  requestedExecutionLevel: asInvoker

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
